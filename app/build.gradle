plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.clockwidgets'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.clockwidgets"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    lint {
        // Print findings in the CI log so they are readable without downloading the report.
        textReport true
        textOutput 'stdout'
    }

    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
